<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="A live map that shows your current location and GPS accuracy.">
  <title>Live Location Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #e8edf2;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .status-pill {
      position: fixed;
      z-index: 1000;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 32px);
      min-height: 46px;
      padding: 10px 16px;
      transform: translateX(-50%);
      border: 1px solid rgb(20 35 50 / 8%);
      border-radius: 999px;
      background: rgb(255 255 255 / 96%);
      box-shadow: 0 3px 16px rgb(20 35 50 / 16%);
      color: #233344;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.25;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .status-dot {
      flex: 0 0 9px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f0ad32;
      box-shadow: 0 0 0 3px rgb(240 173 50 / 15%);
    }

    .status-pill[data-state="live"] .status-dot {
      background: #2eae65;
      box-shadow: 0 0 0 3px rgb(46 174 101 / 15%);
    }

    .status-pill[data-state="error"] .status-dot {
      background: #d64545;
      box-shadow: 0 0 0 3px rgb(214 69 69 / 15%);
    }

    .recenter-button {
      position: fixed;
      z-index: 1000;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 126px;
      min-height: 50px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 16px rgb(20 35 50 / 22%);
      color: #263648;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .recenter-button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgb(20 35 50 / 25%);
    }

    .recenter-button:not(:disabled):active {
      transform: translateY(0);
    }

    .recenter-button:disabled {
      opacity: .7;
      cursor: wait;
    }

    .recenter-button:focus-visible {
      outline: 3px solid #4285f4;
      outline-offset: 3px;
    }

    .recenter-icon {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #4285f4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .user-location-icon {
      border: 0;
      background: transparent;
    }

    .user-location-marker {
      position: relative;
      display: block;
      width: 36px;
      height: 36px;
    }

    .user-location-marker::before,
    .user-location-marker::after {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      content: "";
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .user-location-marker::before {
      width: 34px;
      height: 34px;
      background: rgb(66 133 244 / 20%);
      animation: location-pulse 2s ease-out infinite;
    }

    .user-location-marker::after {
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      background: #4285f4;
      box-shadow: 0 1px 5px rgb(0 0 0 / 40%);
    }

    @keyframes location-pulse {
      0% {
        opacity: .85;
        transform: translate(-50%, -50%) scale(.55);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.35);
      }
    }

    .leaflet-control-attribution {
      font-size: 11px !important;
    }

    @media (max-width: 480px) {
      .status-pill {
        min-height: 42px;
        padding: 9px 13px;
        font-size: 13px;
      }

      .recenter-button {
        min-width: 116px;
        min-height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Map showing your live location"></div>

  <div id="gps-status" class="status-pill" data-state="searching" role="status" aria-live="polite">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="status-message">Searching for GPS...</span>
  </div>

  <button id="recenter-button" class="recenter-button" type="button" disabled>
    <svg class="recenter-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="7"></circle>
      <circle cx="12" cy="12" r="2"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
    <span>Recenter</span>
  </button>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    "use strict";

    const statusPill = document.getElementById("gps-status");
    const statusMessage = document.getElementById("status-message");
    const recenterButton = document.getElementById("recenter-button");

    function setStatus(message, state) {
      statusMessage.textContent = message;
      statusPill.dataset.state = state;
    }

    // OSM tiles require internet access; the user's GPS location does not.
    const map = L.map("map", {
      zoomControl: false,
      zoomSnap: 0.5
    }).setView([20, 0], 2);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);

    const markerIcon = L.divIcon({
      className: "user-location-icon",
      html: '<span class="user-location-marker" aria-label="Your current location"></span>',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    let locationMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let hasFix = false;
    let followLocation = true;
    let animationFrame = null;

    function onLocation(position) {
      const { latitude, longitude, accuracy } = position.coords;
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        setStatus("GPS returned an invalid location. Still searching...", "error");
        return;
      }

      const target = L.latLng(latitude, longitude);
      const radius = Number.isFinite(accuracy) && accuracy >= 0 ? accuracy : 0;

      if (!locationMarker) {
        locationMarker = L.marker(target, {
          icon: markerIcon,
          keyboard: false,
          zIndexOffset: 1000
        }).addTo(map);
        accuracyCircle = L.circle(target, {
          radius,
          color: "#4285f4",
          weight: 1,
          opacity: .35,
          fillColor: "#4285f4",
          fillOpacity: .14,
          interactive: false
        }).addTo(map);
        map.setView(target, 17);
      } else {
        // Interpolate marker updates so movement remains smooth between GPS fixes.
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
        }
        const start = locationMarker.getLatLng();
        const startedAt = performance.now();
        const duration = 450;

        function animateMarker(now) {
          const progress = Math.min((now - startedAt) / duration, 1);
          const eased = 1 - (1 - progress) ** 3;
          const current = L.latLng(
            start.lat + (target.lat - start.lat) * eased,
            start.lng + (target.lng - start.lng) * eased
          );
          locationMarker.setLatLng(current);
          accuracyCircle.setLatLng(current);
          if (progress < 1) {
            animationFrame = requestAnimationFrame(animateMarker);
          } else {
            animationFrame = null;
          }
        }

        animationFrame = requestAnimationFrame(animateMarker);
        accuracyCircle.setRadius(radius);
        if (followLocation) {
          map.panTo(target, { animate: true, duration: .6 });
        }
      }

      hasFix = true;
      recenterButton.disabled = false;
      setStatus("Live Tracking Active", "live");
    }

    function onLocationError(error) {
      switch (error.code) {
        case error.PERMISSION_DENIED:
          setStatus("Location permission denied. Allow location access in browser settings.", "error");
          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
          }
          break;
        case error.POSITION_UNAVAILABLE:
          setStatus("GPS location unavailable. Check your device's location services.", "error");
          break;
        case error.TIMEOUT:
          setStatus("GPS request timed out. Waiting for a location fix...", "error");
          break;
        default:
          setStatus("Unable to read your location. Check browser permissions and try again.", "error");
      }
    }

    recenterButton.addEventListener("click", () => {
      if (!hasFix || !locationMarker) {
        return;
      }
      followLocation = true;
      map.panTo(locationMarker.getLatLng(), { animate: true, duration: .6 });
    });

    // A manual drag pauses follow mode until the user taps Recenter.
    map.on("dragstart", () => {
      followLocation = false;
    });

    if (!window.isSecureContext) {
      setStatus("Location requires HTTPS or localhost.", "error");
    } else if (!("geolocation" in navigator)) {
      setStatus("This browser does not support GPS location.", "error");
    } else {
      watchId = navigator.geolocation.watchPosition(onLocation, onLocationError, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
      });
    }

    window.addEventListener("pagehide", () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }
      if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
      }
    }, { once: true });
  </script>
</body>
</html>
